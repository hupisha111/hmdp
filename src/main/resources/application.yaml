server:
  port: 8081
spring:
  application:
    name: hmdp
  # 口令等敏感项统一放在 application-local.yaml（已 gitignore，不入库）。
  # 新环境请先复制 application-local.yaml.example 为 application-local.yaml 再填空。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: hupisha
  redis:
    host: 127.0.0.1
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  task:
    scheduling:
      thread-name-prefix: hmdp-scan-   # 定时任务线程名，日志里一眼能认出来
      pool:
        size: 2                        # 默认只有 1 个线程，所有 @Scheduled 会排队串行
  rabbitmq:
    username: hupisha
    host: 127.0.0.1
    port: 5672
    listener:
      simple:
        acknowledge-mode: auto            # 正常返回才 ack，抛异常走重试
        default-requeue-rejected: false  # 重试耗尽后 reject 且不回原队列，配合队列 DLX 进死信
        prefetch: 10
        retry:
          enabled: true                  # 本地重试：同线程重调 listener，不是退回 broker 重投
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
